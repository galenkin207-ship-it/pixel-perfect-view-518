name: Deploy uchet-frontend (staging)

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Backup current staging version on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TS=$(date +%Y%m%d_%H%M%S)
            mkdir -p /opt/uchet_backups/frontend-staging
            cp -a /opt/uchet-staging/frontend-src /opt/uchet_backups/frontend-staging/$TS
            echo "$TS" > /opt/uchet_backups/frontend-staging/LAST_BACKUP
            # Храним только 2 последних бэкапа на staging (не критично, экономим место)
            cd /opt/uchet_backups/frontend-staging && ls -1t -d */ 2>/dev/null | tail -n +3 | xargs -r rm -rf

      - name: Sync files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git/" --exclude=".github/" --exclude="node_modules/" --exclude=".output/" --exclude="server/"
          path: ./
          remote_path: /opt/uchet-staging/frontend-src/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install, build, restart, health-check and auto-rollback
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rollback() {
              echo "!!! ОШИБКА — откатываюсь на предыдущую версию (staging) !!!"
              LAST=$(cat /opt/uchet_backups/frontend-staging/LAST_BACKUP)
              rm -rf /opt/uchet-staging/frontend-src
              cp -a /opt/uchet_backups/frontend-staging/$LAST /opt/uchet-staging/frontend-src
              sudo systemctl restart uchet-frontend-staging
              exit 1
            }

            cd /opt/uchet-staging/frontend-src || rollback
            npm_config_cache=/opt/npm-cache npm install || rollback
            npm_config_cache=/opt/npm-cache npm run build || rollback
            sudo systemctl restart uchet-frontend-staging || rollback
            sudo systemctl is-active uchet-frontend-staging || rollback
            sleep 2
            curl -sf http://127.0.0.1:4000/ > /dev/null || rollback
            echo "Деплой frontend (staging) успешен."
